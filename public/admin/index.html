<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AK Studio CMS</title>
    <link rel="icon" type="image/png" href="/uploads/AK_icon.png" />
    
    <link rel="stylesheet" href="https://unpkg.com/@staticcms/app@^4.0.0/dist/main.css" />
    
    <style>
      /* --- TYLKO TWOJE KOLORY I BRANDING --- */
      body { background: #f4f4f7; margin: 0; }
      
      /* Podmiana logo na ekranie logowania */
      [class*="LoginContainer"] [class*="Logo"] {
        background: url('/uploads/AK_icon.png') no-repeat center !important;
        background-size: contain !important;
        width: 120px !important; height: 120px !important; display: block !important;
      }
      [class*="LoginContainer"] [class*="Logo"] svg { display: none !important; }
      
      /* Fioletowy kolor marki AK Studio dla głównych przycisków */
      :root {
        --button-primary-background: #3b3244;
        --button-primary-hover: #4a3f55;
      }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/@staticcms/app@^4.0.0/dist/static-cms-app.js"></script>
    <script>
      // Inicjalizacja CMS
      window.CMS.init();
    </script>
  </body>
</html>
