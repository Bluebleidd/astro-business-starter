site_url: "[Your Site URL]"
display_name: "[Your Company] CMS"
local_backend: false

backend:
  name: github
  repo: "[your-github-username]/[your-repo-name]"
  branch: "main"
  base_url: "[Your Site URL]"
  auth_endpoint: /api/auth

max_file_size: 52428800

media_folder: "src/assets/uploads"
public_folder: "/src/assets/uploads"
locale: 'en'

media_library:
  max_file_size: 52428800

collections:
  - name: "site_management"
    label: "Site Management"
    format: "json"
    editor:
      preview: false
    files:
      
      # ----------------------------------------
      # STRONA GŁÓWNA
      # HOME PAGE
      # ----------------------------------------
      - name: "services_page"
        label: "Home Page"
        file: "src/data/services.json"
        fields:
          - { label: "Hero Title - Part 1 (black)", name: "hero_title_1", widget: "string" }
          - { label: "Hero Title - Part 2 (gray)", name: "hero_title_2", widget: "string" }
          - label: "Hero Features"
            name: "hero_features"
            widget: "list"
            required: false
            summary: "{{feature}}"
            fields:
              - { label: "Feature", name: "feature", widget: "string" }
          - { label: "Hero Image (BEFORE)", name: "hero_image_before", widget: "image" }
          - { label: "Hero Image (AFTER)", name: "hero_image_after", widget: "image" }
          - { label: "Services Section Title", name: "title", widget: "string" }
          - name: "services"
            label: "Service Cards"
            label_singular: "Service"
            widget: "list"
            summary: '{{title}}'
            fields:
              - { label: "Service Title", name: "title", widget: "string" }
              - { label: "Service Description", name: "description", widget: "text" }
              - label: "Service Icon"
                name: "icon"
                widget: "select"
                required: false
                options:
                  - { label: "🛡️ Shield", value: "ShieldCheck" }
                  - { label: "🩹 Bandage", value: "Bandage" }
                  - { label: "❤️ Heart", value: "Heart" }
                  - { label: "➕ Plus Square", value: "PlusSquare" }
                  - { label: "✨ Sparkles", value: "Sparkles" }
                  - { label: "⭐ Star", value: "Star" }
                  - { label: "💧 Droplets", value: "Droplets" }
                  - { label: "✂️ Scissors", value: "Scissors" }
                  - { label: "🖐️ Hand", value: "Hand" }
                  - { label: "🔍 Search", value: "Search" }
                  - { label: "⚡ Zap", value: "Zap" }
                  - { label: "🍃 Leaf", value: "Leaf" }

      # ----------------------------------------
      # O MNIE
      # ABOUT
      # ----------------------------------------
      - name: "about_page"
        label: "About"
        file: "src/data/about.json"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Profile Image", name: "profileImage", widget: "image" }
          - { label: "Biography", name: "description", widget: "markdown" }
          - label: "Certificates"
            name: "certificates"
            widget: "list"
            summary: '{{name}}'
            fields:
              - { label: "Certificate Name", name: "name", widget: "string" }
              - { label: "Image / Scan", name: "image", widget: "image" }
              - { label: "Date Obtained", name: "date", widget: "string", required: false }

      # ----------------------------------------
      # CENNIK
      # PRICING
      # ----------------------------------------
      - name: "pricing_page"
        label: "Pricing"
        file: "src/data/pricing.json"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - label: "Price Categories"
            name: "categories"
            widget: "list"
            summary: '{{category_name}}'
            fields:
              - { label: "Category Name", name: "category_name", widget: "string" }
              - label: "Services"
                name: "services"
                widget: "list"
                summary: '{{service_name}} ({{price}})'
                fields:
                  - { label: "Service Name", name: "service_name", widget: "string" }
                  - { label: "Price", name: "price", widget: "string" }

      # ----------------------------------------
      # GALERIA
      # ----------------------------------------
      - name: "gallery"
        label: "Gallery"
        file: "src/data/gallery.json"
        fields:
          - { label: "Gallery Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
          - name: "images"
            label: "Gallery Items"
            widget: "list"
            types:
              - label: "Single Image"
                name: "single"
                widget: "object"
                fields:
                  - { label: "Image", name: "image", widget: "image" }
                  - { label: "SEO Description (Important for Google)", name: "alt", widget: "string" }
              
              - label: "Slider (Before/After)"
                name: "before_after"
                widget: "object"
                fields:
                  - { label: "Image (BEFORE)", name: "image_before", widget: "image" }
                  - { label: "Image (AFTER)", name: "image_after", widget: "image" }
                  - { label: "SEO Description (Important for Google)", name: "alt", widget: "string" }
              
              - label: "Video"
                name: "video"
                widget: "object"
                fields:
                  - label: "Video File"
                    name: "video"
                    widget: "file"
                    media_library:
                     config:
                      max_file_size: 52428800
                  - { label: "SEO Description (Important for Google)", name: "alt", widget: "string" }

      # ----------------------------------------
      # KONTAKT
      # CONTACT
      # ----------------------------------------
      - name: "contact_page"
        label: "Contact"
        file: "src/data/contact.json"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Phone Number (display, e.g. 123-456-789)", name: "phone", widget: "string" }
          - { label: "Phone Number (for links, e.g. 123456789)", name: "phoneLink", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Facebook Link", name: "facebook", widget: "string" }
          - { label: "Instagram Link", name: "instagram", widget: "string" }
          - { label: "Address", name: "address", widget: "string" }
          - { label: "City", name: "city", widget: "string" }
          - { label: "Google Maps Link", name: "googleMapsLink", widget: "string" }